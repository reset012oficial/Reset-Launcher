[package]
name = "reset-launcher"
version = "0.1.0"
edition = "2021"
description = "Offline launcher for Reset (Minecraft Rust Edition)"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }

# GUI dependencies
eframe = { version = "0.30", features = ["persistence"] }
rfd = "0.14"
directories-next = "2.0"
image = "0.25"
md5 = "0.7"
open = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"